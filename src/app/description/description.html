<div class="container mt-4">
    <h2> Description du produit</h2>
  @if (product(); as p) {
    <div class="row">
      <div class="col-md-4">
        <img [src]="p.image" [alt]="p.title" class="img-fluid">
      </div>
      <div class="col-md-8">
        <h2>{{ p.title }}</h2>
        <p class="fs-4">{{ p.price }} €</p>
        <p class="fs-4" style="background-color:white;">{{ p.description }}</p>
        <button class="btn btn-primary btn-sm" (click)=" ajouterAuPanier()">Ajouter au Panier </button>
      </div>
       
    </div>
  }
</div>
