<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>NovaMarket - Connexion</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background-color: #CBD5E1; color: #1E3A8A; }
  .navbar { background-color: #1E3A8A !important; }
  .navbar-brand, .nav-link { color: #FFFFFF !important; }
  .form-control { background-color: #FFFFFF; }
  .btn-primary { background-color: #2563EB; border-color: #2563EB; color: #FFFFFF; }
  footer { background-color: #1E3A8A; color: #FFFFFF; }
</style>
</head>
<body>

<nav class="navbar navbar-expand">
  <div class="container">
    <a class="navbar-brand" href="accueil.html">NovaMarket</a>

    </ul>
  </div>
</nav>

<div class="container mt-4" style="max-width: 400px;">
  <h1 class="mb-4">Connexion</h1>

  <form>
    <div class="mb-3">
      <label class="form-label">Identifiant</label>
      <input type="text" class="form-control" placeholder="vous@exemple.com">
    </div>
    <div class="mb-3">
      <label class="form-label">Mot de passe</label>
      <input type="password" class="form-control" placeholder="********">
    </div>
    <button type="button" class="btn btn-primary w-100">Créer un compte</button>
  </form>

  <p class="mt-3">Déjà un compte ? <a routerLink="../login">Se connecter</a></p>

<footer class="mt-5 py-4 text-center">
