<div class="card mb-2" style="background-color: #F8FAFC; color: #1E3A8A;">
  <div class="card-body d-flex align-items-center gap-3">
    <img
      [src]="item.product.image"
      [alt]="item.product.title"
      class="rounded"
      style="width: 80px; height: 80px; object-fit: cover;"
    />

    <div class="flex-grow-1">
      <div class="fw-semibold">{{ item.product.title }}</div>
      <div>{{ item.product.price.toFixed(2) }} €</div>
    </div>

    <div class="d-flex align-items-center gap-2">
      <button type="button" class="btn btn-outline-primary btn-sm" (click)="decrement()">-</button>
      <span class="fw-semibold">{{ item.quantity }}</span>
      <button type="button" class="btn btn-outline-primary btn-sm" (click)="increment()">+</button>
    </div>
  </div>
</div>
