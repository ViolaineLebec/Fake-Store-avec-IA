<div class="card h-100" [routerLink]="['/description', product.id]" style="cursor: pointer;">
  <img [src]="product.image" class="card-img-top p-3" [alt]="product.title" style="height: 180px; object-fit: contain;">
  <div class="card-body d-flex flex-column">
    <h5 class="card-title" style="font-size: 0.95rem;">{{ product.title }}</h5>
    <p class="card-text mt-auto">{{ product.price }} €</p>
    <button class="btn btn-primary btn-sm" (click)="$event.stopPropagation(); ajouterAuPanier()">Ajouter</button>
  </div>
</div>
