<div class="card" style="width: 18rem;">
  <img
    [src]="produit.image"
    class="card-img-top"
    [alt]="produit.title">

  <div class="card-body">
    <h5 class="card-title">{{ produit.title }}</h5>

    <p class="card-text">
      {{ produit.price }} €
    </p>

    <button class="btn btn-primary btn-sm" (click)="ajouterAuPanier()">
      Ajouter 
    </button>
  </div>
</div>
